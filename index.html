<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Molecule 3D Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Jost:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark-panel: rgba(15, 15, 15, 0.85);
            --border-light: rgba(255, 255, 255, 0.1);
            --border-light-focus: rgba(255, 255, 255, 0.15);
            --text-active: #deff9a;
            --text-active-lvl2: #ffde9a;
            --keyboard-inset: 0px;
        }

        /* ★スクロール破綻を物理的に防ぐ完全固定スタイル */
        html, body {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
            margin: 0;
            padding: 0;
            background-color: #eaf4ff;
            color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.3s ease;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        #canvas-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
            touch-action: none;
            overflow: hidden; /* はみ出し防止 */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .view-label {
            position: absolute;
            top: 15px;
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(0, 0, 0, 0.25);
            text-transform: uppercase;
            font-weight: 500;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80vw;
            transition: opacity 0.5s ease, left 0.3s ease;
        }
        #label-left { left: 20px; }
        #label-right { display: none; }

        /* UI基本レイアウト */
        #ui-wrapper {
            position: absolute;
            bottom: calc(24px + var(--keyboard-inset));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.3s ease;
        }

        .ui-panel {
            pointer-events: auto;
            background: var(--bg-dark-panel);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-light);
            transition: all 0.3s ease;
        }

        #search-panel {
            padding: 0;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
        }

        .ui-group {
            display: flex;
            align-items: center;
            gap: 8px;
            border-right: none;
            padding-right: 12px;
        }
        .ui-group:last-child {
            border-right: none;
            padding-right: 0;
        }

        #search-container {
            display: flex;
            align-items: center;
            background: var(--bg-dark-panel); 
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light-focus);
            border-radius: 20px;
            padding: 6px 8px 6px 14px;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        #search-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 13px;
            outline: none;
            width: 140px;
            transition: width 0.3s ease;
            -webkit-user-select: text;
            user-select: text;
            -webkit-touch-callout: default;
        }
        #ss-compounds, #ss-interval, #ss-speed {
            -webkit-user-select: text;
            user-select: text;
            -webkit-touch-callout: default;
        }
        #search-input::placeholder {
            color: rgba(255, 255, 255, 0.45); 
        }

        #search-clear {
            background: transparent;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            display: none; 
            align-items: center;
            justify-content: center;
            padding: 2px;
            transition: color 0.2s ease;
        }
        #search-clear:hover {
            color: #fff;
        }
        #search-clear svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
            position: relative;
        }
        .icon-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        .icon-btn.active {
            color: var(--text-active);
            background: rgba(222, 255, 154, 0.15);
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .icon-btn.level-2 {
            color: var(--text-active-lvl2);
            background: rgba(255, 222, 154, 0.15);
        }
        .icon-btn.reverse svg {
            transform: scaleX(-1);
        }
        .rotation-controls {
            display: flex;
            flex-direction: row;
            gap: 4px;
        }
        #btn-rotate-speed .speed-arrow {
            transition: stroke 0.2s ease;
        }

        /* モーダル用CSS */
        #ss-overlay {
            display: none;
            position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 1999; pointer-events: auto;
        }
        #ss-modal {
            display: none;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 2000; flex-direction: column; padding: 20px 24px;
            width: 90%; max-width: 380px; gap: 16px;
            max-height: 90dvh; 
            overflow-y: auto;  
            -webkit-overflow-scrolling: touch; 
        }
        .ss-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
        }
        .ss-row label {
            font-size: 12px; color: rgba(255,255,255,0.7); font-weight: 500;
        }
        .ss-segment {
            display: flex; gap: 4px; background: rgba(255,255,255,0.05);
            padding: 4px; border-radius: 20px; border: 1px solid var(--border-light);
        }
        #compound-pick-overlay {
            display: none;
            position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 1999; pointer-events: auto;
        }
        #compound-pick-modal {
            display: none;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 2000; flex-direction: column; padding: 20px 24px;
            width: 90%; max-width: 420px; gap: 16px;
            max-height: 80dvh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #compound-pick-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
        }
        #compound-pick-list .compound-pick-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            font-size: 12px;
            padding: 8px 14px;
            line-height: 1.3;
            transition: all 0.2s ease;
            text-align: left;
        }
        #compound-pick-list .compound-pick-btn:hover {
            color: #fff;
            background: rgba(222, 255, 154, 0.18);
            border-color: rgba(222, 255, 154, 0.35);
        }
        #compound-pick-list.editing {
            flex-direction: column;
            flex-wrap: nowrap;
            gap: 6px;
        }
        .compound-edit-row {
            display: grid;
            grid-template-columns: 30px minmax(0, 1fr) 30px;
            align-items: center;
            min-height: 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.85);
            transition: border-color 0.2s ease, background 0.2s ease, opacity 0.2s ease;
        }
        .compound-edit-row.dragging {
            opacity: 0.45;
            background: rgba(222, 255, 154, 0.12);
            border-color: rgba(222, 255, 154, 0.45);
        }
        .compound-edit-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
            padding: 0 4px;
        }
        .compound-drag-handle {
            cursor: grab;
            touch-action: none;
        }
        .compound-drag-handle:active {
            cursor: grabbing;
        }
        .compound-delete-btn:hover:not(:disabled) {
            color: #ff9a9a;
            background: rgba(240, 80, 80, 0.12);
        }
        .compound-delete-btn:disabled {
            cursor: default;
            opacity: 0.35;
        }
        #compound-pick-actions {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }
        .compound-register-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.82);
            cursor: pointer;
            font-size: 12px;
            padding: 8px 14px;
            transition: all 0.2s ease;
        }
        .compound-register-btn:hover:not(:disabled) {
            color: #fff;
            background: rgba(222, 255, 154, 0.18);
            border-color: rgba(222, 255, 154, 0.35);
        }
        .compound-register-btn:disabled {
            cursor: default;
            opacity: 0.45;
        }

        #toast-notification {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(240, 80, 80, 0.9);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            z-index: 3000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            opacity: 0;
            display: none;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        #toast-notification.has-action {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }
        .toast-action-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.45);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 9px;
        }
        .toast-action-btn:hover {
            background: rgba(255,255,255,0.14);
        }

        #portrait-warning {
            display: none;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: #0a0a0a;
            color: #fff;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            text-align: center;
            overflow: hidden;
        }
        #portrait-warning svg {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            stroke: #deff9a;
            margin-bottom: 20px;
            fill: none;
            stroke-width: 1.5;
        }
        #portrait-warning p {
            box-sizing: border-box;
            width: 100%;
            max-width: 340px;
            font-size: 14px;
            letter-spacing: 1px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
        }
        #portrait-warning p.portrait-sub {
            font-size: 12px;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.45);
            max-width: 300px;
        }
        #portrait-dismiss-btn {
            margin-top: 8px;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            background: var(--text-active);
            color: #14170f;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s ease;
        }
        #portrait-dismiss-btn:active {
            transform: scale(0.96);
        }

        @media (max-width: 1024px) and (orientation: portrait), (pointer: coarse) and (orientation: portrait) {
            #portrait-warning {
                display: flex;
            }
        }

        html.portrait-ok #portrait-warning {
            display: none !important;
        }

        /* 縦画面用UI：操作を4列×2行へ固定し、速度ボタンも2行内に収める */
        @media (max-width: 1024px) and (orientation: portrait), (pointer: coarse) and (orientation: portrait) {
            #ui-wrapper {
                flex-direction: column;
                gap: 10px;
            }
            #control-panel {
                display: grid;
                grid-template-columns: repeat(4, 30px);
                grid-template-rows: repeat(2, 30px);
                column-gap: 8px;
                row-gap: 8px;
                justify-content: center;
                align-items: center;
                max-width: 92vw;
            }
            #control-panel > .ui-group {
                display: contents;
            }
            #btn-stereo { grid-column: 1; grid-row: 1; }
            #btn-depth { grid-column: 2; grid-row: 1; }
            #btn-model { grid-column: 3; grid-row: 1; }
            #btn-bg { grid-column: 1; grid-row: 2; }
            #btn-gloss { grid-column: 2; grid-row: 2; }
            #btn-ss { grid-column: 3; grid-row: 2; }
            .rotation-controls {
                flex-direction: column;
                grid-column: 4;
                grid-row: 1 / 3;
                align-self: stretch;
                justify-content: space-between;
                gap: 0;
            }
            #search-container {
                max-width: 92vw;
            }
        }

        @media (max-width: 1366px) and (orientation: landscape), (pointer: coarse) and (orientation: landscape) {
            #ui-wrapper {
                bottom: 0; top: 0; left: 0; right: 0; transform: none; display: block;
            }
            #control-panel {
                position: absolute; left: 0; top: 50%;
                transform: translateY(-50%) scale(0.85); transform-origin: left center;
                flex-direction: column; padding: 16px 8px; gap: 12px;
                border-radius: 0 24px 24px 0; border-left: none;
            }
            .ui-group {
                flex-direction: column; border-right: none;
                border-bottom: 1px solid var(--border-light);
                padding-right: 0; padding-bottom: 12px; gap: 8px;
            }
            .rotation-controls {
                flex-direction: column;
            }
            .ui-group:last-child {
                border-bottom: none; padding-bottom: 0;
            }
            #search-panel {
                position: absolute; bottom: calc(24px + var(--keyboard-inset)); left: 50vw;
                transform: translateX(-50%); display: block;
            }
            #search-container {
                opacity: 0.85; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                padding: 6px 8px 6px 14px; 
            }
            #search-input {
                width: 140px; font-size: 14px;
            }
            #search-container:focus-within {
                opacity: 1.0; box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            }
            #search-container:focus-within #search-input {
                width: 180px; 
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        (function(){
            try {
                if (localStorage.getItem('mv3d_portrait_dismissed') === '1') {
                    document.documentElement.classList.add('portrait-ok');
                }
            } catch (e) {}
        })();
    </script>
    <div id="app-container">
        <div id="ss-exit-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 1500; cursor: pointer;"></div>

        <div id="portrait-warning">
            <svg viewBox="0 0 24 24">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                <path d="M12 18h.01"/>
                <path d="M17 6H7"/>
            </svg>
            <p>立体視の表示最適化のため、端末を横向き（Landscape）に回転してください。</p>
            <p class="portrait-sub">※縦向きのままでも使えます。その場合は立体視が見えにくいことがあるため、デフォルトは単眼モードで表示します。</p>
            <button type="button" id="portrait-dismiss-btn">このまま使用する</button>
        </div>
        <div id="toast-notification"></div>
        
        <div id="label-left" class="view-label">L-cysteine</div>
        <div id="label-right" class="view-label"></div>
        
        <div id="canvas-container"></div>

        <div id="ui-wrapper">
            <div id="search-panel" class="ui-panel">
                <div id="search-container">
                    <input type="text" id="search-input" placeholder="化合物名 / 示性式" value="L-cysteine">
                    <button id="search-clear" title="Clear text">
                        <svg viewBox="0 0 24 24">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                    <button class="icon-btn" id="search-submit" title="Search [Right-click / Long-press: SS compounds]">
                        <svg viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div id="control-panel" class="ui-panel">
                <div class="ui-group">
                    <button class="icon-btn active" id="btn-stereo" title="Stereo Mode: Cross-eyed [s]">
                        <svg viewBox="0 0 24 24"><line x1="5" y1="3" x2="19" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="3" x2="5" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                    <button class="icon-btn" id="btn-depth" title="Depth: Normal [d]">
                        <svg viewBox="0 0 24 24">
                            <polygon points="7,6 7,18 11,17 11,7" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>
                            <polygon points="17,6 17,18 13,17 13,7" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>

                <div class="ui-group">
                    <button class="icon-btn" id="btn-model" title="Model: Ball and Stick [m]">
                        <svg viewBox="0 0 24 24">
                            <circle cx="6" cy="6" r="3"/>
                            <circle cx="18" cy="18" r="3"/>
                            <line x1="8.12" y1="8.12" x2="15.88" y2="15.88"/>
                        </svg>
                    </button>
                </div>

                <div class="ui-group">
                    <button class="icon-btn active" id="btn-bg" title="Background: Blue [b]">
                        <svg viewBox="0 0 24 24">
                            <rect id="bg-icon-rect" x="4" y="4" width="16" height="16" rx="2" fill="#eaf4ff" stroke="currentColor"/>
                        </svg>
                    </button>
                </div>

                <div class="ui-group">
                    <button class="icon-btn" id="btn-gloss" title="Toggle Gloss [g]">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="rotation-controls">
                        <button class="icon-btn" id="btn-autorotate" title="Rotation: Stopped [r]">
                            <svg viewBox="0 0 24 24">
                                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38"/>
                            </svg>
                        </button>
                        <button class="icon-btn" id="btn-rotate-speed" title="Rotation Speed: Standard (180°/10s) [v]">
                            <svg viewBox="0 0 24 24">
                                <path class="speed-arrow" id="rotate-speed-arrow-slow" d="M6 17V12m-2 3 2-3 2 3"/>
                                <path class="speed-arrow" id="rotate-speed-arrow-standard" d="M12 17V9m-2.5 3 2.5-3 2.5 3"/>
                                <path class="speed-arrow" id="rotate-speed-arrow-fast" d="M18 17V5m-3 3 3-3 3 3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="ui-group">
                    <button class="icon-btn" id="btn-ss" title="Screen Saver [Long-press/Right-click for settings]">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="5" width="18" height="12" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
                            <line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="12" cy="11" r="2.5" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="compound-pick-overlay"></div>
        <div id="compound-pick-modal" class="ui-panel">
            <div style="width:100%; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-light); padding-bottom:10px;">
                <span style="font-weight:600; font-size:13px; letter-spacing:1px; color:var(--text-active);">Screensaver Compounds</span>
                <div style="display:flex; align-items:center; gap:4px;">
                    <button id="compound-pick-edit" class="icon-btn" style="padding:2px;" title="候補分子を編集" aria-label="候補分子を編集"><svg viewBox="0 0 24 24"><path d="M4 20h4L20 8a2.8 2.8 0 0 0-4-4L4 16v4z"/><line x1="13.5" y1="6.5" x2="17.5" y2="10.5"/></svg></button>

    <script>
        // ==========================================
        // 定数・システム設定データ
        // ==========================================
        const ELEMENT_DATA = {
            'H':  { color: 0xffffff, radius: 1.20 },
            'C':  { color: 0x555555, radius: 1.70 },
            'N':  { color: 0x3050f8, radius: 1.55 },
            'O':  { color: 0xff0d0d, radius: 1.52 },
            'F':  { color: 0x90e050, radius: 1.47 },
            'Cl': { color: 0x1ff01f, radius: 1.75 },
            'Br': { color: 0xa62929, radius: 1.85 },
            'I':  { color: 0x940094, radius: 1.98 },
            'P':  { color: 0xff8000, radius: 1.80 },
            'S':  { color: 0xffff30, radius: 1.80 },
            'DEFAULT': { color: 0x888888, radius: 1.50 }
        };

        const ATOMIC_SYMBOLS = [
            null, 'H', 'He', 'Li', 'Be', 'B', 'C', 'N', 'O', 'F', 'Ne', 'Na', 'Mg', 'Al', 'Si', 'P', 'S', 'Cl', 'Ar',
            'K', 'Ca', 'Sc', 'Ti', 'V', 'Cr', 'Mn', 'Fe', 'Co', 'Ni', 'Cu', 'Zn', 'Ga', 'Ge', 'As', 'Se', 'Br', 'Kr',
            'Rb', 'Sr', 'Y', 'Zr', 'Nb', 'Mo', 'Tc', 'Ru', 'Rh', 'Pd', 'Ag', 'Cd', 'In', 'Sn', 'Sb', 'Te', 'I', 'Xe'
        ];
        const OFFLINE_MOLECULES_URL = './assets/default-molecules.json';
        const MOLECULE_CACHE_DB = 'stereo-molecule-cache';
        const MOLECULE_CACHE_STORE = 'molecules';
        const PUBCHEM_MIN_INTERVAL_MS = 1100;
        const PUBCHEM_COOLDOWN_MS = 30000;
        const MOLECULE_FETCH_TIMEOUT_MS = 12000;

        const BG_COLORS = {
            'white': 0xffffff,
            'gray': 0xdadada,
            'blue': 0xeaf4ff
        };

        const STEREO_TITLES = ['Stereo: Cross-eyed [s]', 'Stereo: Parallel [s]', 'Stereo: Single [s]'];
        const DEPTH_VALUES = [0.28, 0.55, 0.85];
        const DEPTH_TITLES = ['Depth: Normal [d]', 'Depth: Deep [d]', 'Depth: Very Deep [d]'];
        const ROTATE_SPEEDS = [10.0, 18.0, 30.0];
        const ROTATE_SPEED_TITLES = ['Slow (180°/18s)', 'Standard (180°/10s)', 'Fast (180°/6s)'];
        
        const MODEL_TITLES = { 
            'ballstick': 'Model: Ball and Stick [m]', 
            'spacefilling': 'Model: Space Filling [m]',
            'ghost': 'Model: Hybrid [m]'
        };

        const SVG_BALLSTICK = `<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><line x1="8.12" y1="8.12" x2="15.88" y2="15.88"/></svg>`;
        const SVG_SPACEFILLING = `<svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><circle cx="15" cy="15" r="5"/></svg>`;
        const SVG_GHOST = `<svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="15" cy="15" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2" fill="currentColor"/><circle cx="15" cy="15" r="1.5" fill="currentColor"/><line x1="10" y1="10" x2="15" y2="15" stroke="currentColor" stroke-width="1.5"/></svg>`;

        // ==========================================
        // アプリケーション状態変数
        // ==========================================
        let currentStereoIndex = 0; 
        let currentRenderMode = 'ballstick';
        let currentBgMode = 'blue';
        let currentGlossMode = false;
        let currentDepthIndex = 0;
        let currentRotateIndex = 1;
        let isAutoRotating = false;
        let currentRotateSpeed = 0;
        let rotateDirection = 1;

        let wakeLock = null;
        let moleculeSceneObjects = [];
        let offsetX = 0;
        let offsetY = 0;

        // ==========================================
        // Three.js 描画コアシステムの構築
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(BG_COLORS[currentBgMode]);

        const moleculeGroup = new THREE.Group();
        scene.add(moleculeGroup);

        const mainCamera = new THREE.PerspectiveCamera(45, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
        mainCamera.position.set(0, 0, 15);
        
        const cameraL = new THREE.PerspectiveCamera(45, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
        const cameraR = new THREE.PerspectiveCamera(45, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.autoClear = false;
        container.appendChild(renderer.domElement);

        let controls;
        try {
            controls = new THREE.OrbitControls(mainCamera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = false; 
            controls.minPolarAngle = 0.08;
            controls.maxPolarAngle = Math.PI - 0.08;
            controls.autoRotate = false; 
            
            if (THREE.MOUSE) {
                controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: null };
            }
            if (THREE.TOUCH) {
                controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: null };
            }
        } catch (e) {
            controls = { update: () => {}, target: new THREE.Vector3() };
        }

        // ライティング設定
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight1.position.set(0, 0, 15);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.2);
        dirLight2.position.set(-10, -15, -10);
        scene.add(dirLight2);

        // ==========================================
        // スクリーンセーバー(自動再生)システム管理
        // ==========================================
        const LEGACY_DEFAULT_COMPOUNDS = "nanokid, adamantane, caffeine, cholesterol, perfluorohexanesulfonic acid, morphine, strychnine, sucrose, adenosine triphosphate, porphine, penicillin v, perfluorooctane, hexahelicene, mirex, tetrodotoxin, capsaicin, linolenic acid, hexanitrohexaazaisowurtzitane, 1-methylsilatrane, decafluorobiphenyl";
        const PREVIOUS_DEFAULT_COMPOUNDS = "nanokid, adamantane, caffeine, cholesterol, perfluorohexanesulfonic acid, morphine, strychnine, sucrose, adenosine triphosphate, porphine, penicillin v, hexahelicene, mirex, tetrodotoxin, capsaicin, 1-methylsilatrane, reserpine, ergotamine, doxorubicin, tetracycline, cryptand-222, astaxanthin, octanitrocubane, dodecahedrane, Fullerene-C20, aconitine";
        const DEFAULT_COMPOUNDS = "nanokid, adamantane, caffeine, cholesterol, perfluorohexanesulfonic acid, morphine, strychnine, sucrose, adenosine triphosphate, porphine, penicillin v, hexahelicene, mirex, tetrodotoxin, capsaicin, 1-methylsilatrane, reserpine, ergotamine, doxorubicin, tetracycline, cryptand-222, astaxanthin, octanitrocubane, dodecahedrane, Fullerene-C36, aconitine";
        const COMPOUND_DEFAULTS_VERSION = 3;
        const COMPOUND_CIDS = {
            'fullerene-c36': '101760755'
        };
        const COMPOUND_DISPLAY_NAMES = {
            '101760755': 'Fullerene-C36'
        };
        // 縦画面でもスクリーンセーバーの名前ラベルが収まる上限。
        const MAX_COMPOUND_TITLE_LENGTH = 18;
        const normalizeCompoundList = (value) => String(value || '')
            .split(/,|\n/)
            .map(name => name.trim().toLocaleLowerCase())
            .filter(Boolean)
            .join('\n');

        let ssSettings = JSON.parse(localStorage.getItem('ss_settings')) || {};
        const normalizedRegisteredCompounds = normalizeCompoundList(ssSettings.compounds);
        const shouldInstallNewDefaults = !ssSettings.compounds
            || normalizedRegisteredCompounds === normalizeCompoundList(LEGACY_DEFAULT_COMPOUNDS)
            || normalizedRegisteredCompounds === normalizeCompoundList(PREVIOUS_DEFAULT_COMPOUNDS);
        if (shouldInstallNewDefaults) ssSettings.compounds = DEFAULT_COMPOUNDS;
        if (shouldInstallNewDefaults || !ssSettings.compoundDefaultsVersion) {
            ssSettings.compoundDefaultsVersion = COMPOUND_DEFAULTS_VERSION;
            localStorage.setItem('ss_settings', JSON.stringify(ssSettings));
        }
        if (!ssSettings.order) ssSettings.order = "sequential";
        if (typeof ssSettings.interval === 'undefined') ssSettings.interval = 15;
        if (typeof ssSettings.speed === 'undefined') ssSettings.speed = 18;
        if (!ssSettings.exitMode) ssSettings.exitMode = "normal";
        if (!ssSettings.bg) ssSettings.bg = "random";
        if (!ssSettings.model) ssSettings.model = "random";
        if (!ssSettings.stereo) ssSettings.stereo = "random";
        if (!ssSettings.depth) ssSettings.depth = "random";
        if (!ssSettings.gloss) ssSettings.gloss = "random";
        if (typeof ssSettings.nameDisplay === 'undefined') ssSettings.nameDisplay = "sans"; // ★デフォルト文字をサンセリフに
        if (typeof ssSettings.nameShake === 'undefined') ssSettings.nameShake = "true";
        let currentDisplayedMoleculeName = 'L-cysteine';
        let moleculeFetchRequestId = 0;
        let moleculeFetchAbort = null;
        let bundledMoleculesPromise = null;
        const moleculeMemoryCache = new Map();
        let moleculeCacheDbPromise = null;
        let pubChemRequestQueue = Promise.resolve();
        let pubChemNextRequestAt = 0;
        let pubChemCooldownUntil = 0;
        
        let ssActive = false;
        let ssTimer = null;
        let ssCurrentIndex = 0;
        let ssRandomQueue = [];
        let ssRandomQueueKey = '';
        let ssLastRandomCompound = null;
        let ssFailCount = 0;
        let ssFetchAbort = null;
        let ssPendingFx = null;
        let previousState = {};

        // SS用：カメラ/ワールド混合 + 軸漂い回転
        let ssRotateClockTime = 0;
        const ssRotateAxis = new THREE.Vector3();
        const ssRotateAxisTarget = new THREE.Vector3();
        const ssCameraAxis = new THREE.Vector3();
        const ssWorldAxis = new THREE.Vector3();
        const ssMixedAxis = new THREE.Vector3();
        const ssFinalAxis = new THREE.Vector3();
        const ssTmpVec = new THREE.Vector3();

        function randomUnitVector3(v) {
            v.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
            if (v.lengthSq() < 1e-6) v.set(0, 1, 0);
            v.normalize();
        }

        function initSSRotateState() {
            ssRotateClockTime = Math.random() * Math.PI * 2;
            randomUnitVector3(ssRotateAxis);
            randomUnitVector3(ssRotateAxisTarget);
        }

        const SS_VALS = {
            bg: ['blue', 'gray', 'white'],
            model: ['ballstick', 'spacefilling', 'ghost']
        };

        function startScreenSaver() {
            if (ssActive) return;
            ssActive = true;
            
            const ssOverlay = document.getElementById('ss-exit-overlay');
            ssOverlay.style.display = 'block';
            ssOverlay.style.pointerEvents = ssSettings.exitMode === 'strict' ? 'none' : 'auto';
            ssOverlay.dataset.exiting = "false";
            ssPointersDown = 0;
            ssClickCount = 0;

            const elem = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => { console.warn(`Fullscreen API Error: ${err.message}`); });
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            }
            
            const uiWrapper = document.getElementById('ui-wrapper');
            uiWrapper.style.opacity = '0';
            uiWrapper.style.pointerEvents = 'none';
            document.getElementById('label-left').style.opacity = '0.3';
            
            previousState = {
                bg: currentBgMode,
                model: currentRenderMode,
                stereo: currentStereoIndex,
                depth: currentDepthIndex,
                gloss: currentGlossMode,
                rotateIndex: currentRotateIndex,
                isAutoRotating: isAutoRotating,
                rotateDirection: rotateDirection,
                sdfData: window.currentSdfData,
                labelText: document.getElementById('label-left').textContent,
                cameraPosition: mainCamera.position.clone(),
                groupQuaternion: moleculeGroup.quaternion.clone(),
                offsetX: offsetX,
                offsetY: offsetY
            };
            
            isAutoRotating = true;
            currentRotateSpeed = ssSettings.speed;
            offsetX = 0;
            offsetY = 0;
            moleculeGroup.rotation.set(0, 0, 0);
            controls.target.set(0, 0, 0);
            mainCamera.position.set(0, 0, 15);
            initSSRotateState();
            updateWakeLock();

            if (ssFetchAbort) ssFetchAbort.abort();
            ssFetchAbort = new AbortController();
            resetSSRandomQueue();
            
            loadNextSSMolecule();
        }

        function resetSSRandomQueue() {
            ssRandomQueue = [];
            ssRandomQueueKey = '';
            ssLastRandomCompound = null;
        }

        function nextRandomSSCompound(list) {
            const listKey = list.join('\u001F');
            if (ssRandomQueueKey !== listKey || ssRandomQueue.length === 0) {
                ssRandomQueue = list.slice();
                ssRandomQueueKey = listKey;
                for (let i = ssRandomQueue.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [ssRandomQueue[i], ssRandomQueue[j]] = [ssRandomQueue[j], ssRandomQueue[i]];
                }
                if (ssRandomQueue.length > 1 && ssRandomQueue[ssRandomQueue.length - 1] === ssLastRandomCompound) {
                    const swapIndex = Math.floor(Math.random() * (ssRandomQueue.length - 1));
                    [ssRandomQueue[ssRandomQueue.length - 1], ssRandomQueue[swapIndex]] = [ssRandomQueue[swapIndex], ssRandomQueue[ssRandomQueue.length - 1]];
                }
            }
            const compound = ssRandomQueue.pop();
            ssLastRandomCompound = compound;
            return compound;
        }

        function pickSSEffects() {
            return {
                bg: (ssSettings.bg === 'random') ? SS_VALS.bg[Math.floor(Math.random() * 3)] : ssSettings.bg,
                model: (ssSettings.model === 'random') ? SS_VALS.model[Math.floor(Math.random() * 3)] : ssSettings.model,
                stereo: (ssSettings.stereo === 'random') ? Math.floor(Math.random() * 3) : parseInt(ssSettings.stereo),
                depth: (ssSettings.depth === 'random') ? Math.floor(Math.random() * 3) : parseInt(ssSettings.depth),
                gloss: (ssSettings.gloss === 'random') ? (Math.random() > 0.5) : (ssSettings.gloss === 'true')
            };
        }

        function applySSPendingFx() {
            if (!ssPendingFx) return;

            updateStereoCameras();
            ssPendingFx = null;

        let nameClockTime = 0;
        let nameFontsReady = false;

        const NAME_FONT_CSS = {
            serif: "italic 600 100px 'Cormorant Garamond', serif",
            sans: "300 90px 'Jost', sans-serif"
        };

        async function ensureNameFontsLoaded() {
            if (nameFontsReady) return;
            try {
                await Promise.all([

                    document.fonts.load(NAME_FONT_CSS.sans)
                ]);
            } catch (e) { }

        }

        function drawSpacedText(ctx, text, x, y, spacing) {
            let totalWidth = 0;
            for (const ch of text) totalWidth += ctx.measureText(ch).width + spacing;
            totalWidth -= spacing;
            let curX = x - totalWidth / 2;
            for (const ch of text) {
                const w = ctx.measureText(ch).width;
                ctx.fillText(ch, curX + w / 2, y);
                curX += w + spacing;
            }
        }

        function createNameTexture(text, fontKey) {
            const displayText = text.toUpperCase();
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const fontCss = NAME_FONT_CSS[fontKey] || NAME_FONT_CSS.serif;
            const spacing = fontKey === 'sans' ? 14 : 6;

            ctx.font = fontCss;
            const textWidth = ctx.measureText(displayText).width + displayText.length * spacing;

            canvas.width = Math.ceil(textWidth + 160);
            canvas.height = 220;

            ctx.font = fontCss;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(40, 40, 40, 0.55)';

            drawSpacedText(ctx, displayText, canvas.width / 2, canvas.height / 2, spacing);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return { texture, aspect: canvas.width / canvas.height };
        }

        function removeNameSprite() {
            if (nameSprite) {
                scene.remove(nameSprite);
                if (nameSprite.geometry) nameSprite.geometry.dispose();
                if (nameSprite.material.map) nameSprite.material.map.dispose();
                nameSprite.material.dispose();
                nameSprite = null;
            }
            nameOpacityState.current = 0;
            nameOpacityState.target = 0;
        }

        function updateNameSpritePlacement() {
            if (!nameSprite) return;

            const worldHeight = nameSprite.userData.worldHeight;
            const cameraUp = new THREE.Vector3(0, 1, 0).applyQuaternion(mainCamera.quaternion).normalize();
            const cameraDistance = mainCamera.position.distanceTo(controls.target);
            const halfVisibleHeight = Math.tan(THREE.MathUtils.degToRad(mainCamera.fov / 2)) * cameraDistance;
            const desiredOffset = currentMoleculeRadius + worldHeight / 2 + 0.45;
            const safeOffset = Math.max(0, halfVisibleHeight - worldHeight / 2 - 0.2);
            const verticalOffset = Math.min(desiredOffset, safeOffset);

            nameSpriteBasePosition.copy(controls.target).addScaledVector(cameraUp, -verticalOffset);
            nameSprite.position.copy(nameSpriteBasePosition);
            nameSprite.quaternion.copy(mainCamera.quaternion);
        }

        async function updateNameSprite(text) {
            removeNameSprite();
            if (ssSettings.nameDisplay === 'off') return;

            await ensureNameFontsLoaded();
            if (!ssActive) return; 

            const { texture, aspect } = createNameTexture(text, ssSettings.nameDisplay);
            const material = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                opacity: 0,
                depthWrite: false,
                side: THREE.DoubleSide
            });

            // ★フォントサイズを80%に調整 (0.32 * 0.8 = 0.256, 0.5 * 0.8 = 0.4)
            const worldHeight = Math.max(currentMoleculeRadius * 0.256, 0.4);
            const worldWidth = worldHeight * aspect;
            const geometry = new THREE.PlaneGeometry(worldWidth, worldHeight);
            nameSprite = new THREE.Mesh(geometry, material);

            nameSprite.userData.worldHeight = worldHeight;
            updateNameSpritePlacement();

            scene.add(nameSprite);

            nameOpacityState.current = 0;
            nameOpacityState.target = 0.40; // ★透明度をやや上げる（不透明度0.55 -> 0.40）
        }

        function loadNextSSMolecule() {
            if (!ssActive) return;

            if (list.length === 0) list.push('benzene');

            if (ssFailCount >= list.length) {

                return;

            let comp = '';
            if (ssSettings.order === 'random') {
                comp = nextRandomSSCompound(list);
            } else {
                comp = list[ssCurrentIndex % list.length];
                ssCurrentIndex++;
            }
            
            fetchMoleculeData(comp, true);
        }

        function skipToNextSSMolecule() {

            clearTimeout(ssTimer);

            if (ssFetchAbort) ssFetchAbort.abort();
