        function parseSDF(sdfText) {
            const lines = sdfText.split(/\r?\n/);
            if (lines.length < 4) throw new Error("Invalid SDF format");

            const countsLine = lines[3];
            const atomCount = parseInt(countsLine.substring(0, 3).trim());
            const bondCount = parseInt(countsLine.substring(3, 6).trim());

            if (isNaN(atomCount)) throw new Error("Failed to parse atom counts");

            const atoms = [];
            for (let i = 0; i < atomCount; i++) {
                const line = lines[4 + i];
                if (!line) continue;
                const x = parseFloat(line.substring(0, 10).trim());
                const y = parseFloat(line.substring(10, 20).trim());
                const z = parseFloat(line.substring(20, 30).trim());
                const element = line.substring(31, 34).trim();
                atoms.push({ x, y, z, element });
            }

            const bonds = [];
            const bondStartLine = 4 + atomCount;
            for (let i = 0; i < bondCount; i++) {
                const line = lines[bondStartLine + i];
                if (!line) continue;
                const a = parseInt(line.substring(0, 3).trim()) - 1;
                const b = parseInt(line.substring(3, 6).trim()) - 1;
                const order = parseInt(line.substring(6, 9).trim());
                bonds.push({ a, b, order });
            }

            let formula = null;
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].includes('PUBCHEM_MOLECULAR_FORMULA')) {
                    if (lines[i+1]) {
                        formula = lines[i+1].trim();
                    }
                    break;
                }
            }
            return { atoms, bonds, formula: formula || buildHillFormula(atoms.map(atom => atom.element)) };
        }

        function buildHillFormula(elements) {
            const counts = new Map();
            elements.forEach(element => counts.set(element, (counts.get(element) || 0) + 1));
            const ordered = [];
            if (counts.has('C')) ordered.push('C');
            if (counts.has('H')) ordered.push('H');
            Array.from(counts.keys()).filter(element => element !== 'C' && element !== 'H').sort().forEach(element => ordered.push(element));
            return ordered.map(element => `${element}${counts.get(element) === 1 ? '' : counts.get(element)}`).join('');
        }

        function parsePubChemJson(record) {
            const compound = record?.PC_Compounds?.[0];
            const atomIds = compound?.atoms?.aid;
            const atomNumbers = compound?.atoms?.element;
            const coordinateSet = compound?.coords?.find(coords => coords?.conformers?.[0]?.x && coords?.conformers?.[0]?.y && coords?.conformers?.[0]?.z);
            const conformer = coordinateSet?.conformers?.[0];
            if (!compound || !Array.isArray(atomIds) || !Array.isArray(atomNumbers) || !coordinateSet || !conformer) {
                throw new Error('PubChemの3D構造データを読み取れませんでした。');
            }

            const coordinatesByAid = new Map();
            coordinateSet.aid.forEach((aid, index) => {
                coordinatesByAid.set(aid, { x: conformer.x[index], y: conformer.y[index], z: conformer.z[index] });
            });
            const atomIndexByAid = new Map();
            const atoms = atomIds.map((aid, index) => {
                const coordinate = coordinatesByAid.get(aid);
                const element = ATOMIC_SYMBOLS[atomNumbers[index]] || 'DEFAULT';
                if (!coordinate || !Number.isFinite(coordinate.x) || !Number.isFinite(coordinate.y) || !Number.isFinite(coordinate.z)) {
                    throw new Error('PubChemの3D座標が不完全です。');
                }
                atomIndexByAid.set(aid, index);
                return { ...coordinate, element };
            });
            const bonds = (compound.bonds?.aid1 || []).map((aid1, index) => ({
                a: atomIndexByAid.get(aid1),
                b: atomIndexByAid.get(compound.bonds.aid2[index]),
                order: compound.bonds.order[index] || 1
            })).filter(bond => Number.isInteger(bond.a) && Number.isInteger(bond.b));
            return { atoms, bonds, formula: buildHillFormula(atoms.map(atom => atom.element)) };
        }

        function normalizeMoleculeKey(value) {
            return String(value || '').trim().toLocaleLowerCase().replace(/\s+/g, ' ');
        }

        function moleculeKeys(query, cid) {
            const keys = [normalizeMoleculeKey(query)];
            if (cid) keys.push(`cid:${cid}`);
            return [...new Set(keys.filter(Boolean))];
        }

        function loadBundledMolecules() {
            if (!bundledMoleculesPromise) {
                bundledMoleculesPromise = fetch(OFFLINE_MOLECULES_URL)
                    .then(response => {
                        if (!response.ok) throw new Error(`Offline molecule bundle: ${response.status}`);
                        return response.json();
                    })
                    .then(bundle => {
                        const bundled = new Map();
                        Object.entries(bundle?.molecules || {}).forEach(([key, molecule]) => {
                            bundled.set(normalizeMoleculeKey(key), molecule);
                            bundled.set(normalizeMoleculeKey(molecule.name), molecule);
                            if (molecule.cid) bundled.set(`cid:${molecule.cid}`, molecule);
                        });
                        return bundled;
                    })
                    .catch(error => {
                        console.warn('Offline molecule bundle could not be loaded.', error);
                        return new Map();
                    });
            }
            return bundledMoleculesPromise;
        }

        function openMoleculeCacheDb() {
            if (moleculeCacheDbPromise) return moleculeCacheDbPromise;
            if (!window.indexedDB) return Promise.resolve(null);
            moleculeCacheDbPromise = new Promise(resolve => {
                const request = indexedDB.open(MOLECULE_CACHE_DB, 1);
                request.onupgradeneeded = () => request.result.createObjectStore(MOLECULE_CACHE_STORE);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => resolve(null);
            });
            return moleculeCacheDbPromise;
        }

        async function readPersistentMolecule(key) {
            const db = await openMoleculeCacheDb();
            if (!db) return null;
            return new Promise(resolve => {
                const request = db.transaction(MOLECULE_CACHE_STORE, 'readonly').objectStore(MOLECULE_CACHE_STORE).get(key);
                request.onsuccess = () => resolve(request.result?.data || null);
                request.onerror = () => resolve(null);
            });
        }

        async function cacheMolecule(keys, data) {
            keys.forEach(key => moleculeMemoryCache.set(key, data));
            const db = await openMoleculeCacheDb();
            if (!db) return;
            try {
                const transaction = db.transaction(MOLECULE_CACHE_STORE, 'readwrite');
                keys.forEach(key => transaction.objectStore(MOLECULE_CACHE_STORE).put({ data, savedAt: Date.now() }, key));
            } catch (error) {
                console.warn('Molecule cache write failed.', error);
            }
        }

        async function findCachedMolecule(keys) {
            const bundled = await loadBundledMolecules();
            for (const key of keys) {
                if (bundled.has(key)) return { data: bundled.get(key), source: 'offline' };
                if (moleculeMemoryCache.has(key)) return { data: moleculeMemoryCache.get(key), source: 'cache' };
            }
            for (const key of keys) {
                const cached = await readPersistentMolecule(key);
                if (cached) {
                    keys.forEach(cacheKey => moleculeMemoryCache.set(cacheKey, cached));
                    return { data: cached, source: 'cache' };
                }
            }
            return null;
        }

        function abortError() {
            return new DOMException('The molecule request was aborted.', 'AbortError');
        }

        function waitWithSignal(milliseconds, signal) {
            if (!milliseconds) return Promise.resolve();
            return new Promise((resolve, reject) => {
                if (signal?.aborted) return reject(abortError());
                const timer = setTimeout(resolve, milliseconds);
                signal?.addEventListener('abort', () => {
                    clearTimeout(timer);
                    reject(abortError());
                }, { once: true });
            });
        }

        async function fetchWithTimeout(url, signal) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), MOLECULE_FETCH_TIMEOUT_MS);
            const abort = () => controller.abort();
            signal?.addEventListener('abort', abort, { once: true });
            try {
                return await fetch(url, { signal: controller.signal });
            } catch (error) {
                if (controller.signal.aborted && !signal?.aborted) {
                    const timeoutError = new Error('Structure request timed out.');
                    timeoutError.isTimeout = true;
                    throw timeoutError;
                }
                throw error;
            } finally {
                clearTimeout(timeout);
                signal?.removeEventListener('abort', abort);
            }
        }

        function enqueuePubChem(request, signal) {
            const queued = pubChemRequestQueue.catch(() => {}).then(async () => {
                const wait = Math.max(0, pubChemNextRequestAt - Date.now());
                await waitWithSignal(wait, signal);
                pubChemNextRequestAt = Date.now() + PUBCHEM_MIN_INTERVAL_MS;
                return request();
            });
            pubChemRequestQueue = queued.catch(() => {});
            return queued;
        }

        async function fetchPubChemMolecule(query, cid, signal) {
            const url = cid
                ? `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/JSON?record_type=3d`
                : `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(query)}/JSON?record_type=3d`;
            const response = await enqueuePubChem(() => fetchWithTimeout(url, signal), signal);
            if (!response.ok) {
                const error = new Error(`PubChem request failed (${response.status})`);
                error.status = response.status;
                throw error;
            }
            return parsePubChemJson(await response.json());
        }

        async function fetchCidSmiles(cid, signal) {
            const url = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/property/IsomericSMILES/JSON`;
            const response = await enqueuePubChem(() => fetchWithTimeout(url, signal), signal);
            if (!response.ok) throw new Error(`PubChem SMILES request failed (${response.status})`);
            const data = await response.json();
            return data?.PropertyTable?.Properties?.[0]?.SMILES || null;
        }

        async function fetchCirMolecule(identifier, signal) {
            const url = `https://cactus.nci.nih.gov/chemical/structure/${encodeURIComponent(identifier)}/file?format=sdf&get3d=True`;
            const response = await fetchWithTimeout(url, signal);
            if (!response.ok) throw new Error(`CIR request failed (${response.status})`);
            return parseSDF(await response.text());
        }

        async function fetchRemoteMolecule(query, cid, signal) {
            let pubChemError = null;
            if (Date.now() >= pubChemCooldownUntil) {
                try {
                    return { data: await fetchPubChemMolecule(query, cid, signal), source: 'pubchem' };
                } catch (error) {
                    if (error.name === 'AbortError') throw error;
                    pubChemError = error;
                    if (!error.status || error.status >= 500) pubChemCooldownUntil = Date.now() + PUBCHEM_COOLDOWN_MS;
                }
            }

            try {
                if (cid && (!pubChemError || pubChemError.status !== 500)) {
                    throw pubChemError || new Error('PubChemは一時休止中です。');
                }
                const cirIdentifier = cid ? await fetchCidSmiles(cid, signal) : query;
                if (!cirIdentifier) throw new Error('CIDからSMILESを取得できませんでした。');
                return { data: await fetchCirMolecule(cirIdentifier, signal), source: 'cir' };
            } catch (cirError) {
                if (cirError.name === 'AbortError') throw cirError;
                throw pubChemError || cirError;
            }
        }

        function getCurrentEyeAspect() {
            const isMobileLandscape = window.matchMedia("(max-width: 1366px) and (orientation: landscape), (pointer: coarse) and (orientation: landscape)").matches;
            const controlPanel = document.getElementById('control-panel');
            const panelWidth = (isMobileLandscape && !ssActive && controlPanel) ? controlPanel.getBoundingClientRect().width : 0;
            const renderWidth = window.innerWidth - panelWidth;
            const height = window.innerHeight;

            if (currentStereoIndex === 2) {
                return renderWidth / height;
            } else {
                return (renderWidth / 2) / height;
            }
        }

        function getFittedCameraDistance(radius) {
            const vFovRad = (mainCamera.fov / 2) * THREE.MathUtils.DEG2RAD;
            const labelReserve = (ssActive && ssSettings.nameDisplay !== 'off')
                ? Math.max(radius * 0.256, 0.4) + 0.65
                : 0;
            const distV = (radius + labelReserve) / Math.sin(vFovRad);
            const hFovRad = Math.atan(Math.tan(vFovRad) * getCurrentEyeAspect());
            const distH = radius / Math.sin(hFovRad);
            return Math.max(Math.max(distV, distH) * 1.3, 10);
        }

        function getCompoundCid(query) {
            const directCid = query.match(/^(?:cid\s*:\s*)?(\d+)$/i);
            return directCid ? directCid[1] : COMPOUND_CIDS[query.toLocaleLowerCase()];
        }

        async function fetchCompoundTitle(cid, signal) {
            if (Date.now() < pubChemCooldownUntil) return null;
            const titleUrl = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/property/Title/JSON`;
            const response = await enqueuePubChem(() => fetchWithTimeout(titleUrl, signal), signal);
            if (!response.ok) return null;
            const titleData = await response.json();
            return titleData?.PropertyTable?.Properties?.[0]?.Title || null;
        }

        function getCompoundDisplayName(cid, title, fallbackName) {
            if (COMPOUND_DISPLAY_NAMES[cid]) return COMPOUND_DISPLAY_NAMES[cid];
            if (title && Array.from(title).length <= MAX_COMPOUND_TITLE_LENGTH) return title;
            return `CID:${cid || fallbackName}`;
        }

        function fitScreenSaverToViewport() {
            if (!ssActive || !window.currentSdfData || !currentMoleculeRadius) return;
            offsetX = 0;
            offsetY = 0;
            const direction = new THREE.Vector3().subVectors(mainCamera.position, controls.target).normalize();
            mainCamera.position.copy(controls.target).add(direction.multiplyScalar(getFittedCameraDistance(currentMoleculeRadius)));
            updateNameSpritePlacement();
        }

        function buildMoleculeGeometry(data, keepOffset = false) {
            moleculeSceneObjects.forEach(obj => {
                moleculeGroup.remove(obj);
                if(obj.geometry) obj.geometry.dispose();
                if(obj.material) obj.material.dispose();
            });
            moleculeSceneObjects = [];

            if (!data.atoms || data.atoms.length === 0) return;

            if (currentBgMode === 'white') {
                ELEMENT_DATA['H'].color = 0xf2f7ff; 
            } else {
                ELEMENT_DATA['H'].color = 0xffffff;
            }

            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            let minZ = Infinity, maxZ = -Infinity;

            data.atoms.forEach(a => {
                if (a.x < minX) minX = a.x;
                if (a.x > maxX) maxX = a.x;
                if (a.y < minY) minY = a.y;
                if (a.y > maxY) maxY = a.y;
                if (a.z < minZ) minZ = a.z;
                if (a.z > maxZ) maxZ = a.z;
            });

            const geometricCenter = new THREE.Vector3(
                (minX + maxX) / 2,
                (minY + maxY) / 2,
                (minZ + maxZ) / 2
            );

            const atomPositions = data.atoms.map(a => {
                return new THREE.Vector3(a.x, a.y, a.z).sub(geometricCenter);
            });

            const roughnessValue = currentGlossMode ? 0.2 : 0.9;
            const metalnessValue = currentGlossMode ? 0.1 : 0.0;

            // 原子（不透明部分）の描画
            data.atoms.forEach((atom, index) => {
                const elementInfo = ELEMENT_DATA[atom.element] || ELEMENT_DATA['DEFAULT'];
                
                if (currentRenderMode === 'ballstick' || currentRenderMode === 'ghost') {
                    let radius = elementInfo.radius * 0.35;
                    
                    if (currentRenderMode === 'ballstick') radius *= 0.85; 
                    else if (currentRenderMode === 'ghost') radius *= 0.5; 
                    
                    const sphereGeom = new THREE.SphereGeometry(radius, 32, 32);
                    const sphereMat = new THREE.MeshStandardMaterial({
                        color: elementInfo.color,
                        roughness: roughnessValue,
                        metalness: metalnessValue
                    });
                    const mesh = new THREE.Mesh(sphereGeom, sphereMat);
                    mesh.position.copy(atomPositions[index]);
                    moleculeGroup.add(mesh);
                    moleculeSceneObjects.push(mesh);
                } else if (currentRenderMode === 'spacefilling') {
                    const radius = elementInfo.radius;
                    const sphereGeom = new THREE.SphereGeometry(radius, 32, 32);
                    const sphereMat = new THREE.MeshStandardMaterial({
                        color: elementInfo.color,
                        roughness: roughnessValue,
                        metalness: metalnessValue
                    });
                    const mesh = new THREE.Mesh(sphereGeom, sphereMat);
                    mesh.position.copy(atomPositions[index]);
                    moleculeGroup.add(mesh);
                    moleculeSceneObjects.push(mesh);
                }
            });

            // 結合線の描画
            if (currentRenderMode === 'ballstick' || currentRenderMode === 'ghost') {
                const bondMaterial = new THREE.MeshStandardMaterial({
                    color: 0x999999,
                    roughness: roughnessValue,
                    metalness: metalnessValue
                });

                data.bonds.forEach(bond => {
                    const pA = atomPositions[bond.a];
                    const pB = atomPositions[bond.b];

                    const direction = new THREE.Vector3().subVectors(pB, pA);
                    const length = direction.length();
                    direction.normalize();

                    const midPoint = new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5);
                    const quaternion = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
                    const radius = 0.08;

                    const createCylinderMesh = (offsetVector) => {
                        const cylinderGeom = new THREE.CylinderGeometry(radius, radius, length, 16);
                        const mesh = new THREE.Mesh(cylinderGeom, bondMaterial);
                        mesh.position.copy(midPoint);
                        if (offsetVector) mesh.position.add(offsetVector);
                        mesh.quaternion.copy(quaternion);
                        moleculeGroup.add(mesh);
                        moleculeSceneObjects.push(mesh);
                    };

                    if (bond.order === 1) {
                        createCylinderMesh(null);
                    } else if (bond.order === 2) {
                        let upVector = new THREE.Vector3(0, 1, 0);
                        if (Math.abs(direction.dot(upVector)) > 0.95) { upVector.set(1, 0, 0); }
                        
                        let baseOffset = new THREE.Vector3().crossVectors(direction, upVector).normalize();
                        baseOffset.crossVectors(direction, baseOffset.clone()).normalize();
                        
                        const offsetDir = baseOffset.multiplyScalar(0.12);
                        createCylinderMesh(offsetDir);
                        createCylinderMesh(offsetDir.clone().negate());
                    } else if (bond.order === 3) {
                        let upVector = new THREE.Vector3(0, 1, 0);
                        if (Math.abs(direction.dot(upVector)) > 0.95) { upVector.set(1, 0, 0); }
                        
                        let baseOffset = new THREE.Vector3().crossVectors(direction, upVector).normalize();
                        baseOffset.crossVectors(direction, baseOffset.clone()).normalize();
                        
                        const offsetDir = baseOffset.multiplyScalar(0.18);
                        createCylinderMesh(null);
                        createCylinderMesh(offsetDir);
                        createCylinderMesh(offsetDir.clone().negate());
                    } else {
                        createCylinderMesh(null);
                    }
                });
            }

            // 原子（半透明部分: Ghostモードの外殻）の描画
            if (currentRenderMode === 'ghost') {
                data.atoms.forEach((atom, index) => {
                    const elementInfo = ELEMENT_DATA[atom.element] || ELEMENT_DATA['DEFAULT'];
                    const radius = elementInfo.radius;
                    const sphereGeom = new THREE.SphereGeometry(radius, 32, 32);
                    const sphereMat = new THREE.MeshStandardMaterial({
                        color: elementInfo.color,
                        roughness: roughnessValue,
                        metalness: metalnessValue,
                        transparent: true,
                        opacity: 0.3,
                        depthWrite: false
                    });
                    const mesh = new THREE.Mesh(sphereGeom, sphereMat);
                    mesh.position.copy(atomPositions[index]);
                    moleculeGroup.add(mesh);
                    moleculeSceneObjects.push(mesh);
                });
            }

            // オートスケールの計算
            let maxDistance = 0;
            data.atoms.forEach((atom, index) => {
                const elementInfo = ELEMENT_DATA[atom.element] || ELEMENT_DATA['DEFAULT'];
                const dist = atomPositions[index].length() + elementInfo.radius;
                if (dist > maxDistance) maxDistance = dist;
            });
            
            currentMoleculeRadius = maxDistance;

            if (!keepOffset) {
                offsetX = 0;
                offsetY = 0;
                moleculeGroup.rotation.set(0, 0, 0);
                controls.target.set(0, 0, 0);
                
                const dir = new THREE.Vector3().subVectors(mainCamera.position, controls.target).normalize();
                mainCamera.position.copy(controls.target).add(dir.multiplyScalar(getFittedCameraDistance(maxDistance)));
            }
        }

        async function fetchMoleculeData(query, isSS = false) {
            let cleanQuery = query.trim();
            const hasJapanese = /[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/.test(cleanQuery);
            if (!isSS) {
                if (moleculeFetchAbort) moleculeFetchAbort.abort();
                moleculeFetchAbort = new AbortController();
            }
            const signal = isSS ? ssFetchAbort?.signal : moleculeFetchAbort?.signal;
            const requestId = isSS ? null : ++moleculeFetchRequestId;
            const isStaleRequest = () => (isSS && (!ssActive || (signal && signal.aborted)))
                || (!isSS && requestId !== moleculeFetchRequestId);
            
            if (hasJapanese) {
                try {
                    const wikiUrl = `https://ja.wikipedia.org/w/api.php?action=query&prop=langlinks&lllang=en&format=json&origin=*&redirects=1&titles=${encodeURIComponent(cleanQuery)}`;
                    const wikiRes = await fetch(wikiUrl, signal ? { signal } : undefined);
                    if (isStaleRequest()) return;
                    if (wikiRes.ok) {
                        const wikiData = await wikiRes.json();
                        if (isStaleRequest()) return;
                        const pages = wikiData.query.pages;
                        for (const id in pages) {
                            if (pages[id].langlinks && pages[id].langlinks.length > 0) {
                                cleanQuery = pages[id].langlinks[0]['*'];
                                break;
                            }
                        }
                    }
                } catch (e) {
                    if (e.name === 'AbortError') return;
                    console.warn("Wikipedia translation bridge failed, falling back to original query.", e);
                }
            }

            if (isStaleRequest()) return;

            const compoundCid = getCompoundCid(cleanQuery);
            const cacheKeys = moleculeKeys(cleanQuery, compoundCid);
            
            try {
                let result = await findCachedMolecule(cacheKeys);
                if (isStaleRequest()) return;

                if (!result) {
                    result = await fetchRemoteMolecule(cleanQuery, compoundCid, signal);
                    if (isStaleRequest()) return;
                    await cacheMolecule(cacheKeys, result.data);
                }
                const parsedData = result.data;
                if (isSS) applySSPendingFx();
                buildMoleculeGeometry(parsedData, false); 
                window.currentSdfData = parsedData;
                if (!isSS) currentDisplayedMoleculeName = cleanQuery;

                const compoundTitle = compoundCid && !COMPOUND_DISPLAY_NAMES[compoundCid]
                    ? await fetchCompoundTitle(compoundCid, signal).catch(() => null)
                    : null;
                if (isStaleRequest()) return;
                let labelText = compoundCid
                    ? getCompoundDisplayName(compoundCid, compoundTitle, cleanQuery)
                    : cleanQuery;
                document.getElementById('label-left').textContent = labelText;
                
                if (isSS) {
                    if (!ssActive) return;
                    updateNameSprite(labelText);
                    ssFailCount = 0;
                    ssTimer = setTimeout(loadNextSSMolecule, ssSettings.interval * 1000);
                }

            } catch (error) {
                if (error.name === 'AbortError') return;
                if (isStaleRequest()) return;
                if (isSS) {
                    if (!ssActive) return;
                    ssPendingFx = null;
                    ssFailCount++;
                    ssTimer = setTimeout(loadNextSSMolecule, Math.max(PUBCHEM_COOLDOWN_MS, ssSettings.interval * 1000));
                } else {
                    showNotification('構造データを取得できません。しばらくしてから再試行してください。');
                }
            }
        }

        function updateStereoCameras() {
            const target = controls.target; 
            const camPos = mainCamera.position;

            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(mainCamera.quaternion).normalize();
            const up = new THREE.Vector3(0, 1, 0).applyQuaternion(mainCamera.quaternion).normalize();

            const eyeSeparation = DEPTH_VALUES[currentDepthIndex];

            cameraL.position.copy(camPos).addScaledVector(right, -eyeSeparation / 2);
            cameraR.position.copy(camPos).addScaledVector(right, eyeSeparation / 2);

            cameraL.up.copy(up);
            cameraR.up.copy(up);

            cameraL.lookAt(target);
            cameraR.lookAt(target);
        }

        // ==========================================
        // メインアニメーションループ
        // ==========================================
        const clock = new THREE.Clock();
        const controlPanelElement = document.getElementById('control-panel');
        const searchPanelElement = document.getElementById('search-panel');
        const labelLeftElement = document.getElementById('label-left');

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            controls.update();

            if (isAutoRotating) {
                const angle = THREE.MathUtils.degToRad(currentRotateSpeed) * delta;

                if (ssActive) {
                    ssRotateClockTime += delta;

                    ssCameraAxis.set(0, 1, 0).applyQuaternion(mainCamera.quaternion).normalize();
                    ssTmpVec.set(1, 0, 0).applyQuaternion(mainCamera.quaternion).normalize();
                    ssCameraAxis.addScaledVector(ssTmpVec, 0.35).normalize();

                    ssWorldAxis.set(0.35, 1, 0).normalize();

                    const blendW = 0.5 + 0.5 * Math.sin(ssRotateClockTime * 0.28);
                    ssMixedAxis.copy(ssCameraAxis).multiplyScalar(blendW).addScaledVector(ssWorldAxis, 1 - blendW).normalize();

                    if (Math.random() < delta * 0.12) randomUnitVector3(ssRotateAxisTarget);
                    ssRotateAxis.lerp(ssRotateAxisTarget, Math.min(1, delta * 0.4)).normalize();

                    ssFinalAxis.copy(ssMixedAxis).lerp(ssRotateAxis, 0.2).normalize();
                    moleculeGroup.rotateOnWorldAxis(ssFinalAxis, angle);
                } else {
                    const cameraUp = new THREE.Vector3(0, 1, 0).applyQuaternion(mainCamera.quaternion).normalize();
                    moleculeGroup.rotateOnWorldAxis(cameraUp, angle * rotateDirection);
                }
            }

            if (nameSprite) {
                nameClockTime += delta;
                updateNameSpritePlacement();

                if (ssSettings.nameShake !== 'false') {
                    const speed = 1.2;
                    const amplitudeY = currentMoleculeRadius * 0.0375;
                    const amplitudeX = currentMoleculeRadius * 0.03;

                    const bobY = Math.sin(nameClockTime * speed) * amplitudeY
                               + Math.sin(nameClockTime * speed * 2.427) * (amplitudeY * 0.3);
                    const bobX = Math.sin(nameClockTime * speed * 1.098) * amplitudeX
                               + Math.cos(nameClockTime * speed * 1.95) * (amplitudeX * 0.4);

                    const cameraUp = new THREE.Vector3(0, 1, 0).applyQuaternion(mainCamera.quaternion).normalize();
                    const cameraRight = new THREE.Vector3(1, 0, 0).applyQuaternion(mainCamera.quaternion).normalize();
                    nameSprite.position.addScaledVector(cameraUp, bobY).addScaledVector(cameraRight, bobX);
                } else {
                    nameSprite.position.copy(nameSpriteBasePosition);
                }

                nameOpacityState.current += (nameOpacityState.target - nameOpacityState.current) * 0.04;
                nameSprite.material.opacity = nameOpacityState.current;
            }

            updateStereoCameras();
            dirLight1.position.copy(mainCamera.position);

            let panelWidth = 0;
            const isMobileLandscape = window.matchMedia("(max-width: 1366px) and (orientation: landscape), (pointer: coarse) and (orientation: landscape)").matches;

            if (isMobileLandscape && !ssActive) {
                panelWidth = controlPanelElement.getBoundingClientRect().width;
                const searchLeftPos = panelWidth + (window.innerWidth - panelWidth) / 2;
                searchPanelElement.style.left = `${searchLeftPos}px`;
                labelLeftElement.style.left = `${panelWidth + 20}px`;
            } else {
                panelWidth = 0;
                searchPanelElement.style.left = '';
                labelLeftElement.style.left = '20px';
            }

            const renderWidth = window.innerWidth - panelWidth;
            const height = window.innerHeight;

            renderer.clear();

            if (currentStereoIndex === 2) {
                const aspect = renderWidth / height;
                mainCamera.aspect = aspect;
                mainCamera.updateProjectionMatrix();

                mainCamera.projectionMatrix.elements[8] = (offsetX / renderWidth);
                mainCamera.projectionMatrix.elements[9] = (offsetY / height);

                renderer.setViewport(panelWidth, 0, renderWidth, height);
                renderer.setScissor(panelWidth, 0, renderWidth, height);
                renderer.setScissorTest(true);
                renderer.render(scene, mainCamera);
            } else {
                const halfWidth = renderWidth / 2;
                const aspect = halfWidth / height;
                
                cameraL.aspect = aspect;
                cameraL.updateProjectionMatrix();
                cameraR.aspect = aspect;
                cameraR.updateProjectionMatrix();

                cameraL.projectionMatrix.elements[8] = (offsetX / halfWidth);
                cameraL.projectionMatrix.elements[9] = (offsetY / height);
                cameraR.projectionMatrix.elements[8] = (offsetX / halfWidth);
                cameraR.projectionMatrix.elements[9] = (offsetY / height);

                const leftEyeCameraActive = (currentStereoIndex === 1) ? cameraL : cameraR;
                const rightEyeCameraActive = (currentStereoIndex === 1) ? cameraR : cameraL;

                renderer.setViewport(panelWidth, 0, halfWidth, height);
                renderer.setScissor(panelWidth, 0, halfWidth, height);
                renderer.setScissorTest(true);
                renderer.render(scene, leftEyeCameraActive);

                renderer.setViewport(panelWidth + halfWidth, 0, halfWidth, height);
                renderer.setScissor(panelWidth + halfWidth, 0, halfWidth, height);
                renderer.setScissorTest(true);
                renderer.render(scene, rightEyeCameraActive);
            }
        }

        // ==========================================
        // リサイズ・フルスクリーン検知の堅牢化
        // ==========================================
        function resizeCanvas() {
            if (renderer) renderer.setSize(window.innerWidth, window.innerHeight);
            fitScreenSaverToViewport();
        }
        window.addEventListener('resize', resizeCanvas);

        function handleFullscreenChange() {
            setTimeout(resizeCanvas, 100);
            setTimeout(resizeCanvas, 500);
            setTimeout(resizeCanvas, 1000);
            
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            if (!isFullscreen && ssActive) {
                stopScreenSaver();
            }
        }
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        // ==========================================
        // マウス・タッチポインターイベントハンドリング
        // ==========================================
        let isRightDragging = false;
        let isTwoFingerDragging = false;
        let lastPointerX = 0;
        let lastPointerY = 0;
        let lastPinchDistance = 0; 
        const activeTouches = new Map();

        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'mouse' && e.button === 2) {
                isRightDragging = true;
                lastPointerX = e.clientX;
                lastPointerY = e.clientY;
            }
            else if (e.pointerType === 'touch' || e.pointerType === 'pen') {
                activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (activeTouches.size === 2) {
                    isTwoFingerDragging = true;
                    const pts = Array.from(activeTouches.values());
                    lastPointerX = (pts[0].x + pts[1].x) / 2;
                    lastPointerY = (pts[0].y + pts[1].y) / 2;
                    lastPinchDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                }
            }
        });

        let canvasTapStart = null;
        let canvasTapTimer = null;
        let canvasLastTapTime = 0;
        const TAP_MAX_DURATION = 350;
        const TAP_MAX_MOVEMENT = 12;
        const DOUBLE_TAP_DELAY = 280;

        function cycleModelMode() {
            if (currentRenderMode === 'ballstick') currentRenderMode = 'spacefilling';
            else if (currentRenderMode === 'spacefilling') currentRenderMode = 'ghost';
            else currentRenderMode = 'ballstick';
            updateModelMode();
            if (window.currentSdfData) buildMoleculeGeometry(window.currentSdfData, true);
        }

        function reverseAutoRotation() {
            if (!isAutoRotating || ssActive) return false;
            rotateDirection *= -1;
            updateAutoRotateButton();
            return true;
        }

        function cycleCanvasAutoRotation() {
            if (ssActive || isAutoRotating) return false;
            currentRotateSpeed = ROTATE_SPEEDS[currentRotateIndex];
            rotateDirection = 1;
            isAutoRotating = true;
            updateAutoRotateButton();
            updateWakeLock();
            return true;
        }

        function stopCanvasAutoRotation() {
            currentRotateSpeed = 0;
            isAutoRotating = false;
            updateAutoRotateButton();
            updateWakeLock();
        }

        function handleCanvasTap() {
            const now = performance.now();

            if (ssActive && ssSettings.exitMode === 'strict') {
                if (now - canvasLastTapTime <= DOUBLE_TAP_DELAY) {
                    clearTimeout(canvasTapTimer);
                    canvasTapTimer = null;
                    canvasLastTapTime = 0;
                    stopScreenSaver();
                } else {
                    canvasLastTapTime = now;
                    clearTimeout(canvasTapTimer);
                    canvasTapTimer = setTimeout(() => { canvasLastTapTime = 0; }, DOUBLE_TAP_DELAY);
                }
                return;
            }
            if (ssActive) return;

            if (now - canvasLastTapTime <= DOUBLE_TAP_DELAY) {
                clearTimeout(canvasTapTimer);
                canvasTapTimer = null;
                canvasLastTapTime = 0;
                cycleModelMode();
            } else {
                canvasLastTapTime = now;
                clearTimeout(canvasTapTimer);
                canvasTapTimer = setTimeout(() => {
                    canvasLastTapTime = 0;
                    if (!isAutoRotating) cycleCanvasAutoRotation();
                    else if (rotateDirection > 0) reverseAutoRotation();
                    else stopCanvasAutoRotation();
                }, DOUBLE_TAP_DELAY);
            }
        }

        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (e.isPrimary && (e.pointerType !== 'mouse' || e.button === 0)) {
                canvasTapStart = { pointerId: e.pointerId, x: e.clientX, y: e.clientY, time: performance.now() };
            }
        });
        renderer.domElement.addEventListener('pointerup', (e) => {
            if (!canvasTapStart || canvasTapStart.pointerId !== e.pointerId) return;
            const movement = Math.hypot(e.clientX - canvasTapStart.x, e.clientY - canvasTapStart.y);
            const duration = performance.now() - canvasTapStart.time;
            canvasTapStart = null;
            if (movement <= TAP_MAX_MOVEMENT && duration <= TAP_MAX_DURATION) handleCanvasTap();
        });
        renderer.domElement.addEventListener('pointercancel', () => { canvasTapStart = null; });

        window.addEventListener('pointermove', (e) => {
            if (e.pointerType === 'mouse' && isRightDragging) {
                offsetX -= e.clientX - lastPointerX;
                offsetY += e.clientY - lastPointerY; 
                lastPointerX = e.clientX;
                lastPointerY = e.clientY;
            }
            else if (e.pointerType === 'touch' || e.pointerType === 'pen') {
                if (activeTouches.has(e.pointerId)) {
                    activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
                }
                if (isTwoFingerDragging && activeTouches.size === 2) {
                    const pts = Array.from(activeTouches.values());
                    const cx = (pts[0].x + pts[1].x) / 2;
                    const cy = (pts[0].y + pts[1].y) / 2;
                    const currentDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);

                    offsetX -= cx - lastPointerX;
                    offsetY += cy - lastPointerY; 
                    lastPointerX = cx;
                    lastPointerY = cy;

                    if (lastPinchDistance > 0) {
                        const zoomDelta = currentDistance - lastPinchDistance;
                        const dir = new THREE.Vector3().subVectors(mainCamera.position, controls.target);
                        const dist = dir.length();
                        dir.normalize();
                        
                        const newDist = Math.max(2.0, Math.min(60.0, dist - zoomDelta * 0.08));
                        mainCamera.position.copy(controls.target).add(dir.multiplyScalar(newDist));
                    }
                    lastPinchDistance = currentDistance;
                }
            }
        });

        const handlePointerUp = (e) => {
            if (e.pointerType === 'mouse' && e.button === 2) isRightDragging = false;
            else if (e.pointerType === 'touch' || e.pointerType === 'pen') {
                activeTouches.delete(e.pointerId);
                if (activeTouches.size < 2) {
                    isTwoFingerDragging = false;
                    lastPinchDistance = 0;
                }
            }
        };

        window.addEventListener('pointerup', handlePointerUp);
        window.addEventListener('pointercancel', handlePointerUp);
        container.addEventListener('contextmenu', e => e.preventDefault());


        // ==========================================
        // ★完全防壁: SS解除の「遅延解除バリア」処理
        // ==========================================
        let ssPointersDown = 0;
        let ssClickCount = 0;
        let ssClickTimer = null;
        const ssOverlay = document.getElementById('ss-exit-overlay');

        ssOverlay.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            ssPointersDown++;

            if (!ssActive) return;
            
            if (ssSettings.exitMode === 'strict') {
                ssClickCount++;
                if (ssClickCount === 1) ssClickTimer = setTimeout(() => { ssClickCount = 0; }, 500);
                else if (ssClickCount >= 2) {
                    clearTimeout(ssClickTimer);
                    ssOverlay.dataset.exiting = "true";
                }
            } else {
                ssOverlay.dataset.exiting = "true";
            }
        });

        ssOverlay.addEventListener('pointermove', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });

        const handleSSPointerUp = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (ssPointersDown > 0) ssPointersDown--;
            
            if (ssPointersDown <= 0) {
                ssPointersDown = 0; 
                if (ssOverlay.dataset.exiting === "true") {
                    ssOverlay.dataset.exiting = "false";
                    stopScreenSaver();
                }
            }
        };

        ssOverlay.addEventListener('pointerup', handleSSPointerUp);
        ssOverlay.addEventListener('pointercancel', handleSSPointerUp);


        // ==========================================
        // UI操作・入力系コントロールイベント
        // ==========================================
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');

        // 長押しによる画面全体の選択ハイライトを抑制（入力欄は除外）
        document.addEventListener('selectstart', (e) => {
            const el = e.target;
            if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
            e.preventDefault();
        });

        searchInput.addEventListener('input', () => {
            if (searchInput.value.length > 0) searchClear.style.display = 'inline-flex';
            else searchClear.style.display = 'none';
        });

        // ★iPad等でソフトウェアキーボード表示に伴うビジュアルビューポートのずれを解消
        function fixViewportScroll() {
            window.scrollTo(0, 0);
            resizeCanvas();
        }

        function updateSearchKeyboardInset() {
            const viewport = window.visualViewport;
            const isSearchFocused = document.activeElement === searchInput;
            const keyboardInset = (isSearchFocused && viewport)
                ? Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop)
                : 0;
            document.documentElement.style.setProperty('--keyboard-inset', `${keyboardInset}px`);
        }

        searchInput.addEventListener('focus', () => {
            updateSearchKeyboardInset();
            setTimeout(updateSearchKeyboardInset, 50);
            setTimeout(updateSearchKeyboardInset, 300);
        });

        searchInput.addEventListener('blur', () => {
            updateSearchKeyboardInset();
            fixViewportScroll();
            // blur直後はキーボード収納アニメーション中でずれが戻りきらないため遅延リトライ
            setTimeout(fixViewportScroll, 50);
            setTimeout(fixViewportScroll, 300);
            setTimeout(fixViewportScroll, 800);
        });

        if (window.visualViewport) {
            let vvResizeTimer = null;
            window.visualViewport.addEventListener('resize', () => {
                clearTimeout(vvResizeTimer);
                vvResizeTimer = setTimeout(() => {
                    updateSearchKeyboardInset();
                    // キーボードが閉じて表示領域がほぼ全画面に戻ったのに、
                    // ページ側のスクロール位置がずれたままなら補正する
                    const isKeyboardClosed = window.visualViewport.height >= window.innerHeight - 1;
                    if (isKeyboardClosed && (window.visualViewport.offsetTop > 0 || window.scrollY > 0)) {
                        fixViewportScroll();
                    }
                }, 50);
            });
            window.visualViewport.addEventListener('scroll', () => {
                updateSearchKeyboardInset();
                const isKeyboardClosed = window.visualViewport.height >= window.innerHeight - 1;
                if (isKeyboardClosed && (window.visualViewport.offsetTop > 0 || window.scrollY > 0)) {
                    fixViewportScroll();
                }
            });
        }

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.style.display = 'none';
            searchInput.focus();
        });

        const btnSearchSubmit = document.getElementById('search-submit');
        let searchPressTimer;
        let searchIsLongPress = false;

        btnSearchSubmit.addEventListener('click', () => {
            if (searchIsLongPress) {
                searchIsLongPress = false;
                return;
            }
            const query = searchInput.value;
            if (query) { fetchMoleculeData(query); searchInput.blur(); }
        });
        btnSearchSubmit.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            openCompoundPickModal();
        });
        btnSearchSubmit.addEventListener('touchstart', () => {
            searchIsLongPress = false;
            searchPressTimer = setTimeout(() => {
                searchIsLongPress = true;
                openCompoundPickModal();
            }, 500);
        }, { passive: true });
        btnSearchSubmit.addEventListener('touchend', (e) => {
            clearTimeout(searchPressTimer);
            if (searchIsLongPress) e.preventDefault();
        });
        btnSearchSubmit.addEventListener('touchmove', () => {
            clearTimeout(searchPressTimer);
        });
        btnSearchSubmit.addEventListener('selectstart', (e) => { e.preventDefault(); });

        let compoundPickEditMode = false;
        let compoundDragState = null;

        function getRegisteredCompounds() {
            return ssSettings.compounds.split(/,|\n/).map(s => s.trim()).filter(Boolean);
        }

        function saveRegisteredCompounds(list) {
            ssSettings.compounds = list.join(', ');
            saveSSSettings();
        }

        function updateCompoundPickEditButton() {
            const editBtn = document.getElementById('compound-pick-edit');
            const title = compoundPickEditMode ? '編集を完了' : '候補分子を編集';
            editBtn.title = title;
            editBtn.setAttribute('aria-label', title);
            editBtn.classList.toggle('active', compoundPickEditMode);
            editBtn.innerHTML = compoundPickEditMode
                ? '<svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6"/></svg>'
                : '<svg viewBox="0 0 24 24"><path d="M4 20h4L20 8a2.8 2.8 0 0 0-4-4L4 16v4z"/><line x1="13.5" y1="6.5" x2="17.5" y2="10.5"/></svg>';
        }

        function finishCompoundDrag() {
            if (!compoundDragState) return;
            const { row, moved } = compoundDragState;
            row.classList.remove('dragging');
            if (row.hasPointerCapture?.(compoundDragState.pointerId)) row.releasePointerCapture(compoundDragState.pointerId);
            if (moved) {
                const list = Array.from(document.querySelectorAll('#compound-pick-list .compound-edit-row'))
                    .map(item => item.dataset.compound);
                saveRegisteredCompounds(list);
            }
            compoundDragState = null;
        }

        function beginCompoundDrag(event, row) {
            if (!compoundPickEditMode || (event.pointerType === 'mouse' && event.button !== 0)) return;
            event.preventDefault();
            row.setPointerCapture(event.pointerId);
            compoundDragState = {
                row,
                pointerId: event.pointerId,
                startY: event.clientY,
                moved: false
            };
            row.classList.add('dragging');
        }

        function moveCompoundDrag(event) {
            if (!compoundDragState || event.pointerId !== compoundDragState.pointerId) return;
            const { row, startY } = compoundDragState;
            if (Math.abs(event.clientY - startY) > 4) compoundDragState.moved = true;
            if (!compoundDragState.moved) return;

            const listEl = document.getElementById('compound-pick-list');
            const otherRows = Array.from(listEl.querySelectorAll('.compound-edit-row')).filter(item => item !== row);
            const nextRow = otherRows.find(item => event.clientY < item.getBoundingClientRect().top + item.getBoundingClientRect().height / 2);
            if (nextRow) listEl.insertBefore(row, nextRow);
            else listEl.appendChild(row);

            const modal = document.getElementById('compound-pick-modal');
            const modalRect = modal.getBoundingClientRect();
            if (event.clientY < modalRect.top + 44) modal.scrollTop -= 10;
            else if (event.clientY > modalRect.bottom - 44) modal.scrollTop += 10;
        }

        window.addEventListener('pointermove', moveCompoundDrag);
        window.addEventListener('pointerup', finishCompoundDrag);
        window.addEventListener('pointercancel', finishCompoundDrag);

        function removeRegisteredCompound(index) {
            const list = getRegisteredCompounds();
            if (list.length <= 1) {
                showNotification('候補分子は1つ以上必要です。');
                return;
            }
            const [removedName] = list.splice(index, 1);
            saveRegisteredCompounds(list);
            renderCompoundPickList();
            showUndoNotification(`「${removedName}」を削除しました。`, () => {
                const currentList = getRegisteredCompounds();
                currentList.splice(Math.min(index, currentList.length), 0, removedName);
                saveRegisteredCompounds(currentList);
                if (document.getElementById('compound-pick-modal').style.display === 'flex') renderCompoundPickList();
            });
        }

        function renderCompoundPickList() {
            const listEl = document.getElementById('compound-pick-list');
            const registerBtn = document.getElementById('compound-pick-register');
            listEl.innerHTML = '';
            const list = getRegisteredCompounds();
            registerBtn.disabled = !currentDisplayedMoleculeName;
            listEl.classList.toggle('editing', compoundPickEditMode);
            updateCompoundPickEditButton();
            if (list.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'font-size:12px; color:rgba(255,255,255,0.5); padding:8px 0;';
                empty.textContent = '候補分子が設定されていません（SS設定で追加）';
                listEl.appendChild(empty);
            } else {
                list.forEach((name, index) => {
                    if (compoundPickEditMode) {
                        const row = document.createElement('div');
                        row.className = 'compound-edit-row';
                        row.dataset.compound = name;

                        const handle = document.createElement('button');
                        handle.type = 'button';
                        handle.className = 'icon-btn compound-drag-handle';
                        handle.title = 'ドラッグして並べ替え';
                        handle.setAttribute('aria-label', `${name}をドラッグして並べ替え`);
                        handle.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="1" fill="currentColor"/><circle cx="15" cy="7" r="1" fill="currentColor"/><circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="12" r="1" fill="currentColor"/><circle cx="9" cy="17" r="1" fill="currentColor"/><circle cx="15" cy="17" r="1" fill="currentColor"/></svg>';
                        handle.addEventListener('pointerdown', event => beginCompoundDrag(event, row));

                        const nameEl = document.createElement('span');
                        nameEl.className = 'compound-edit-name';
                        nameEl.textContent = name;

                        const deleteBtn = document.createElement('button');
                        deleteBtn.type = 'button';
                        deleteBtn.className = 'icon-btn compound-delete-btn';
                        deleteBtn.title = `${name}を削除`;
                        deleteBtn.setAttribute('aria-label', `${name}を削除`);
                        deleteBtn.disabled = list.length <= 1;
                        deleteBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9 7V4h6v3"/><path d="M7 7l1 13h8l1-13"/><line x1="10" y1="11" x2="10" y2="16"/><line x1="14" y1="11" x2="14" y2="16"/></svg>';
                        deleteBtn.addEventListener('click', () => removeRegisteredCompound(index));

                        row.append(handle, nameEl, deleteBtn);
                        listEl.appendChild(row);
                        return;
                    }

                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'compound-pick-btn';
                    btn.textContent = name;
                    btn.addEventListener('click', () => {
                        searchInput.value = name;
                        searchClear.style.display = 'inline-flex';
                        closeCompoundPickModal();
                        fetchMoleculeData(name);
                        searchInput.blur();
                    });
                    listEl.appendChild(btn);
                });
            }
        }

        function openCompoundPickModal() {
            compoundPickEditMode = false;
            renderCompoundPickList();
            document.getElementById('compound-pick-overlay').style.display = 'block';
            document.getElementById('compound-pick-modal').style.display = 'flex';
        }

        function closeCompoundPickModal() {
            document.getElementById('compound-pick-overlay').style.display = 'none';
            document.getElementById('compound-pick-modal').style.display = 'none';
        }
        document.getElementById('compound-pick-close').addEventListener('click', closeCompoundPickModal);
        document.getElementById('compound-pick-overlay').addEventListener('click', closeCompoundPickModal);
        document.getElementById('compound-pick-edit').addEventListener('click', () => {
            finishCompoundDrag();
            compoundPickEditMode = !compoundPickEditMode;
            renderCompoundPickList();
        });
        document.getElementById('compound-pick-register').addEventListener('click', () => {
            const moleculeName = currentDisplayedMoleculeName;
            if (!moleculeName) {
                showNotification('表示中の分子を登録できません。');
                return;
            }

            const list = getRegisteredCompounds();
            const normalizedName = moleculeName.toLocaleLowerCase();
            if (list.some(name => name.toLocaleLowerCase() === normalizedName)) {
                showNotification('この分子はすでに登録済みです。');
                return;
            }

            list.push(moleculeName);
            saveRegisteredCompounds(list);
            if (window.currentSdfData) {
                cacheMolecule(moleculeKeys(moleculeName, getCompoundCid(moleculeName)), window.currentSdfData)
                    .catch(error => console.warn('Registered molecule cache failed.', error));
            }
            renderCompoundPickList();
            showNotification('表示中の分子を登録しました。');
        });
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value;
                if (query) { fetchMoleculeData(query); searchInput.blur(); }
            }
        });

        const btnStereo = document.getElementById('btn-stereo');
        function updateStereoMode() {
            btnStereo.title = STEREO_TITLES[currentStereoIndex];
            btnStereo.classList.remove('active', 'level-2');
            
            if (currentStereoIndex === 2) {
                btnStereo.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 21V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
            } else if (currentStereoIndex === 0) {
                btnStereo.classList.add('active');
                btnStereo.innerHTML = `<svg viewBox="0 0 24 24"><line x1="5" y1="3" x2="19" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="3" x2="5" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
            } else if (currentStereoIndex === 1) {
                btnStereo.classList.add('active', 'level-2');
                btnStereo.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 21V3M16 21V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
            }
        }
        btnStereo.addEventListener('click', () => { userChangedStereo = true; currentStereoIndex = (currentStereoIndex + 1) % 3; updateStereoMode(); });

        const btnDepth = document.getElementById('btn-depth');
        const DEPTH_SHAPES = [
            '<polygon points="7,6 7,18 11,17 11,7" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><polygon points="17,6 17,18 13,17 13,7" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>',
            '<polygon points="5.5,6 5.5,18 9.5,16.2 9.5,7.8" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><polygon points="18.5,6 18.5,18 14.5,16.2 14.5,7.8" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>',
            '<polygon points="4,6 4,18 8,15.5 8,8.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><polygon points="20,6 20,18 16,15.5 16,8.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>'
        ];
        function updateDepthMode() {
            btnDepth.title = DEPTH_TITLES[currentDepthIndex];
            btnDepth.classList.remove('active', 'level-2');
            if (currentDepthIndex === 1) btnDepth.classList.add('active');
            if (currentDepthIndex === 2) btnDepth.classList.add('active', 'level-2');
            btnDepth.innerHTML = `<svg viewBox="0 0 24 24">${DEPTH_SHAPES[currentDepthIndex]}</svg>`;
        }
        btnDepth.addEventListener('click', () => {
            currentDepthIndex = (currentDepthIndex + 1) % 3;
            updateDepthMode();
        });

        const btnModel = document.getElementById('btn-model');
        function updateModelMode() {
            btnModel.title = MODEL_TITLES[currentRenderMode];
            btnModel.classList.remove('level-2', 'active');
            if (currentRenderMode === 'ballstick') {
                btnModel.innerHTML = SVG_BALLSTICK;
            } else if (currentRenderMode === 'spacefilling') {
                btnModel.innerHTML = SVG_SPACEFILLING;
                btnModel.classList.add('level-2');
            } else if (currentRenderMode === 'ghost') {
                btnModel.innerHTML = SVG_GHOST;
                btnModel.classList.add('active');
            }
        }
        btnModel.addEventListener('click', cycleModelMode);

        const btnBg = document.getElementById('btn-bg');
        const bgIconRect = document.getElementById('bg-icon-rect');
        function updateBgMode(mode) {
            currentBgMode = mode;
            scene.background.setHex(BG_COLORS[mode]);
            let fillHex = '#dadada';
            let titleText = 'Background: Gray [b]';
            if (mode === 'white') { fillHex = '#ffffff'; titleText = 'Background: White [b]'; } 
            else if (mode === 'blue') { fillHex = '#eaf4ff'; titleText = 'Background: Blue [b]'; }
            
            btnBg.title = titleText;
            bgIconRect.setAttribute('fill', fillHex);
            bgIconRect.setAttribute('stroke', mode === 'white' ? '#cccccc' : 'currentColor');
            if (window.currentSdfData) buildMoleculeGeometry(window.currentSdfData, true); 
        }
        btnBg.addEventListener('click', () => {
            if (currentBgMode === 'blue') updateBgMode('gray');
            else if (currentBgMode === 'gray') updateBgMode('white');
            else updateBgMode('blue');
        });

        const btnGloss = document.getElementById('btn-gloss');
        if(currentGlossMode) btnGloss.classList.add('active');
        else btnGloss.classList.remove('active');
        btnGloss.addEventListener('click', () => {
            currentGlossMode = !currentGlossMode;
            if (currentGlossMode) btnGloss.classList.add('active');
            else btnGloss.classList.remove('active');
            if (window.currentSdfData) buildMoleculeGeometry(window.currentSdfData, true); 
        });

        const btnAutoRotate = document.getElementById('btn-autorotate');
        const btnRotateSpeed = document.getElementById('btn-rotate-speed');
        const rotateSpeedArrows = [
            document.getElementById('rotate-speed-arrow-slow'),
            document.getElementById('rotate-speed-arrow-standard'),
            document.getElementById('rotate-speed-arrow-fast')
        ];
        function updateAutoRotateButton() {
            btnAutoRotate.classList.remove('active', 'reverse');
            if (isAutoRotating) btnAutoRotate.classList.add('active');
            if (isAutoRotating && rotateDirection < 0) btnAutoRotate.classList.add('reverse');
            const directionLabel = !isAutoRotating ? 'Stopped' : (rotateDirection < 0 ? 'Reverse' : 'Forward');
            btnAutoRotate.title = `Rotation: ${directionLabel} (${ROTATE_SPEED_TITLES[currentRotateIndex]}) [r]`;
        }
        function updateRotateSpeedButton() {
            const arrowColors = [
                ['var(--text-active)', 'rgba(255,255,255,0.35)', 'rgba(255,255,255,0.35)'],
                ['var(--text-active)', 'var(--text-active)', 'rgba(255,255,255,0.35)'],
                ['var(--text-active-lvl2)', 'var(--text-active-lvl2)', 'var(--text-active-lvl2)']
            ];
            rotateSpeedArrows.forEach((arrow, index) => { arrow.style.stroke = arrowColors[currentRotateIndex][index]; });
            btnRotateSpeed.title = `Rotation Speed: ${ROTATE_SPEED_TITLES[currentRotateIndex]} [v]`;
        }
        async function updateWakeLock() {
            if ('wakeLock' in navigator) {
                if (isAutoRotating && !wakeLock) {
                    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
                } else if (!isAutoRotating && wakeLock) {
                    wakeLock.release().then(() => { wakeLock = null; });
                }
            }
        }
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isAutoRotating) {
                navigator.wakeLock.request('screen').then(wl => wakeLock = wl).catch(() => {});
            }
        });
        let rotatePressTimer = null;
        let rotateLongPressHandled = false;
        btnAutoRotate.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            rotateLongPressHandled = false;
            clearTimeout(rotatePressTimer);
            rotatePressTimer = setTimeout(() => {
                rotateLongPressHandled = reverseAutoRotation();
            }, 450);
        });
        const clearRotateLongPress = () => { clearTimeout(rotatePressTimer); };
        btnAutoRotate.addEventListener('pointerup', clearRotateLongPress);
        btnAutoRotate.addEventListener('pointercancel', clearRotateLongPress);
        btnAutoRotate.addEventListener('contextmenu', (e) => e.preventDefault());
        btnAutoRotate.addEventListener('click', (e) => {
            if (rotateLongPressHandled) {
                e.preventDefault();
                rotateLongPressHandled = false;
                return;
            }
            if (!isAutoRotating) cycleCanvasAutoRotation();
            else if (rotateDirection > 0) reverseAutoRotation();
            else stopCanvasAutoRotation();
            updateWakeLock();
        });
        btnRotateSpeed.addEventListener('click', () => {
            currentRotateIndex = (currentRotateIndex + 1) % ROTATE_SPEEDS.length;
            if (isAutoRotating) currentRotateSpeed = ROTATE_SPEEDS[currentRotateIndex];
            updateAutoRotateButton();
            updateRotateSpeedButton();
        });

        // SS UI & Modal logic
        const btnSS = document.getElementById('btn-ss');
        let ssPressTimer;
        let isLongPress = false;

        btnSS.addEventListener('click', () => {
            if (isLongPress) {
                isLongPress = false;
                return;
            }
            startScreenSaver();
        });
        btnSS.addEventListener('contextmenu', (e) => { e.preventDefault(); openSSModal(); });
        btnSS.addEventListener('touchstart', () => {
            isLongPress = false;
            ssPressTimer = setTimeout(() => { isLongPress = true; openSSModal(); }, 500);
        }, { passive: true });
        btnSS.addEventListener('touchend', (e) => {
            clearTimeout(ssPressTimer);
            if (isLongPress) e.preventDefault(); 
        });
        btnSS.addEventListener('selectstart', (e) => { e.preventDefault(); });

        function openSSModal() {
            document.getElementById('ss-compounds').value = ssSettings.compounds;
            document.getElementById('ss-interval').value = ssSettings.interval;
            document.getElementById('ss-speed').value = ssSettings.speed;
            
            const updateSeg = (id, val) => {
                const seg = document.getElementById(id);
                seg.querySelectorAll('.icon-btn').forEach(btn => {
                    if (btn.dataset.val === String(val)) btn.classList.add('active');
                    else btn.classList.remove('active');
                });
            };
            
            updateSeg('seg-order', ssSettings.order); updateSeg('seg-exit', ssSettings.exitMode);
            updateSeg('seg-bg', ssSettings.bg); updateSeg('seg-model', ssSettings.model);
            updateSeg('seg-stereo', ssSettings.stereo); updateSeg('seg-depth', ssSettings.depth); 
            updateSeg('seg-gloss', ssSettings.gloss);
            updateSeg('seg-namedisplay', ssSettings.nameDisplay);
            updateSeg('seg-nameshake', ssSettings.nameShake);
            
            document.getElementById('ss-overlay').style.display = 'block';
            document.getElementById('ss-modal').style.display = 'flex';
        }

        function closeSSModal() {
            document.getElementById('ss-overlay').style.display = 'none';
            document.getElementById('ss-modal').style.display = 'none';
        }
        document.getElementById('ss-close').addEventListener('click', closeSSModal);
        document.getElementById('ss-overlay').addEventListener('click', closeSSModal);
        
        function saveSSSettings() { localStorage.setItem('ss_settings', JSON.stringify(ssSettings)); }

        document.getElementById('ss-compounds').addEventListener('change', (e) => { ssSettings.compounds = e.target.value; saveSSSettings(); });
        document.getElementById('ss-interval').addEventListener('change', (e) => { ssSettings.interval = parseInt(e.target.value) || 15; saveSSSettings(); });
        document.getElementById('ss-speed').addEventListener('change', (e) => { ssSettings.speed = parseFloat(e.target.value) || 18; saveSSSettings(); });
        
        document.querySelectorAll('.ss-segment').forEach(seg => {
            seg.addEventListener('click', (e) => {
                const btn = e.target.closest('.icon-btn');
                if (!btn) return;
                seg.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                ssSettings[seg.dataset.key] = btn.dataset.val;
                saveSSSettings();

                if (ssActive && seg.dataset.key === 'nameDisplay') {
                    const labelText = document.getElementById('label-left').textContent;
                    updateNameSprite(labelText);
                }
                if (ssActive && seg.dataset.key === 'nameShake' && nameSprite) {
                    if (ssSettings.nameShake === 'false') {
                        nameSprite.position.copy(nameSpriteBasePosition);
                    }
                }
            });
        });

        // ==========================================
        // 縦画面（Portrait）対応：警告の解除・向き連動の単眼デフォルト
        // ==========================================
        const btnPortraitDismiss = document.getElementById('portrait-dismiss-btn');
        if (btnPortraitDismiss) {
            btnPortraitDismiss.addEventListener('click', () => {
                document.documentElement.classList.add('portrait-ok');
                try { localStorage.setItem('mv3d_portrait_dismissed', '1'); } catch (e) {}
                setTimeout(resizeCanvas, 50);
                setTimeout(resizeCanvas, 300);
            });
        }

        let userChangedStereo = false;
        const portraitStereoMQ = window.matchMedia("(max-width: 1024px) and (orientation: portrait), (pointer: coarse) and (orientation: portrait)");

        function applyOrientationStereoDefault() {
            if (userChangedStereo || ssActive) return;
            currentStereoIndex = portraitStereoMQ.matches ? 2 : 0;
            updateStereoMode();
        }

        // ★モバイルの回転直後は innerWidth/innerHeight が一時的にずれることがあるため、
        // フルスクリーン切替と同様に複数回タイミングをずらして再計測する
        function handleOrientationTransition() {
            applyOrientationStereoDefault();
            setTimeout(resizeCanvas, 50);
            setTimeout(resizeCanvas, 150);
            setTimeout(resizeCanvas, 300);
            setTimeout(resizeCanvas, 600);
            setTimeout(resizeCanvas, 1000);
        }

        window.addEventListener('orientationchange', handleOrientationTransition);

        if (portraitStereoMQ.addEventListener) {
            portraitStereoMQ.addEventListener('change', handleOrientationTransition);
        } else if (portraitStereoMQ.addListener) {
            portraitStereoMQ.addListener(handleOrientationTransition);
        }

        // Key bindings
        document.addEventListener('keydown', (e) => {
            if (ssActive) {
                if (e.key.toLowerCase() === 'n') {
                    e.preventDefault();
                    skipToNextSSMolecule();
                    return;
                }
                if (ssSettings.exitMode === 'strict') {
                    if (e.key === 'Escape' || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'p')) stopScreenSaver();
                } else {
                    stopScreenSaver();
                }
                return;
            }
            if (e.key === 'Escape') {
                if (document.getElementById('compound-pick-modal').style.display === 'flex') {
                    closeCompoundPickModal();
                    return;
                }
                if (document.getElementById('ss-modal').style.display === 'flex') {
                    closeSSModal();
                    return;
                }
            }
            if (document.activeElement === searchInput) return;
            switch (e.key.toLowerCase()) {
                case 's': btnStereo.click(); break;
                case 'd': btnDepth.click(); break;
                case 'm': btnModel.click(); break;
                case 'b': btnBg.click(); break;
                case 'g': btnGloss.click(); break;
                case 'r': btnAutoRotate.click(); break;
                case 'v': btnRotateSpeed.click(); break;
            }
        });

        if (searchInput.value.length > 0) searchClear.style.display = 'inline-flex';

        // ==========================================
        // アプリケーション初期化実行
        // ==========================================
        applyOrientationStereoDefault();
        updateDepthMode();
        updateModelMode();
        updateBgMode(currentBgMode);
        updateAutoRotateButton();
        updateRotateSpeedButton();
        fetchMoleculeData('L-cysteine');
        animate();
    </script>
</body>
</html>
